# Anaquel completo con los servicios del mercado.
#
#   cp deploy/.env.ejemplo deploy/.env   # y llena los secretos
#   docker compose -f deploy/docker-compose.servicios.yml --env-file deploy/.env up -d --build
#
# Solo la pasarela queda expuesta. Postgres y los servicios viven en una red
# interna sin salida al exterior (excepto pagos, que habla con Mercado Pago/Clip).
x-servicio: &servicio
  restart: unless-stopped
  mem_limit: 192m
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  networks: [interna]
  depends_on: [postgres]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: anaquel
      POSTGRES_PASSWORD: ${PG_SUPER}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
      PG_ACCESO_PASSWORD: ${PG_ACCESO_PASSWORD}
      PG_MERCADO_PASSWORD: ${PG_MERCADO_PASSWORD}
      PG_REELS_PASSWORD: ${PG_REELS_PASSWORD}
      PG_PAGOS_PASSWORD: ${PG_PAGOS_PASSWORD}
    volumes:
      - pg-datos:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks: [interna]

  nucleo: # el backend actual de Anaquel (panel, bodega 3D, web), sin cambios
    build: ..
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATOS_DEMO: ${DEMO:-0}
    volumes: ["./datos:/datos"]
    networks: [interna]

  acceso:
    <<: *servicio
    build: { context: ../services, args: { SERVICIO: acceso } }
    environment:
      BD_DSN: postgres://acceso_app:${PG_ACCESO_PASSWORD}@postgres:5432/anaquel?sslmode=disable
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      CLAVE_DATOS: ${CLAVE_DATOS}
      CLAVE_INDICE: ${CLAVE_INDICE}
      DEMO: ${DEMO:-0}

  mercado:
    <<: *servicio
    build: { context: ../services, args: { SERVICIO: mercado } }
    environment:
      BD_DSN: postgres://mercado_app:${PG_MERCADO_PASSWORD}@postgres:5432/anaquel?sslmode=disable
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      URL_ACCESO: http://acceso:8101
      DEMO: ${DEMO:-0}
    volumes: ["mercado-datos:/datos"]

  reels:
    <<: *servicio
    build: { context: ../services, args: { SERVICIO: reels } }
    environment:
      BD_DSN: postgres://reels_app:${PG_REELS_PASSWORD}@postgres:5432/anaquel?sslmode=disable
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      URL_ACCESO: http://acceso:8101
      URL_MERCADO: http://mercado:8102
      DEMO: ${DEMO:-0}
    volumes: ["reels-datos:/datos"]

  pagos:
    <<: *servicio
    build: { context: ../services, args: { SERVICIO: pagos } }
    environment:
      BD_DSN: postgres://pagos_app:${PG_PAGOS_PASSWORD}@postgres:5432/anaquel?sslmode=disable
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      URL_MERCADO: http://mercado:8102
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      CLIP_API_KEY: ${CLIP_API_KEY:-}
      CLIP_API_SECRET: ${CLIP_API_SECRET:-}
      SIMULADOR: ${DEMO:-0}
      SIMULADOR_SECRETO: ${SIMULADOR_SECRETO}
      SIMULADOR_WEBHOOK: http://pagos:8104/webhooks/simulador
    networks: [interna, salida]

  pasarela:
    <<: *servicio
    build: { context: ../services, args: { SERVICIO: pasarela } }
    environment:
      CLAVE_INTERNA: ${CLAVE_INTERNA}
      URL_NUCLEO: http://nucleo:8080
      URL_ACCESO: http://acceso:8101
      URL_MERCADO: http://mercado:8102
      URL_REELS: http://reels:8103
      URL_PAGOS: http://pagos:8104
      CONFIAR_PROXY: "1" # va detrás del proxy HTTPS del servidor
      HSTS: "1"
    depends_on: [nucleo, acceso, mercado, reels, pagos]
    networks: [interna, rutacree_edge]

volumes:
  pg-datos:
  mercado-datos:
  reels-datos:

networks:
  interna:
    internal: true
  salida:
  rutacree_edge:
    external: true
