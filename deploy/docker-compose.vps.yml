# Ajustes solo del VPS 2.25.68.28 (se usa junto con docker-compose.servicios.yml).
# La pasarela responde con el nombre «anaquel-api» en la red del proxy, el mismo
# que tenía el contenedor anterior: Caddy (/anaquel en :443 y el puerto :15443)
# no cambia. Para regresar a la versión de un solo contenedor basta con
# «docker compose -p anaquel down» y «docker compose -f docker-compose.yml up -d».
services:
  pasarela:
    networks:
      interna: {}
      rutacree_edge:
        aliases: [anaquel-api]

  # Asesor con modelo propio: corre en la GPU de la laptop (AnaquelIA/servir_asesor.py)
  # y llega al VPS por un túnel SSH inverso a 172.16.0.1:18085 (AnaquelIA/tunel_asesor.sh).
  # Si la laptop está apagada, el núcleo contesta con el asesor básico.
  # Respaldo en el VPS (1 CPU, ~29 s por respuesta y casi 1 GB de RAM):
  #   docker compose ... --profile llm-vps up -d llm   y LLM_URL=http://llm:8080
  # El modelo lo arma deploy/llm/armar_modelo.sh en /root/anaquel/llm.
  llm:
    profiles: [llm-vps]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: ["-m", "/m/anaquel-asesor.gguf", "--alias", "anaquel-asesor", "-c", "4096", "-np", "1", "-t", "1",
              "--host", "0.0.0.0", "--port", "8080", "--cache-reuse", "256"]
    volumes: ["../llm:/m:ro"]
    mem_limit: 900m
    cpus: 0.85
    networks: [interna]

  nucleo:
    environment:
      LLM_URL: http://host.docker.internal:18085
      ANAQUEL_URL_PUBLICA: https://2.25.68.28/anaquel
    extra_hosts: ["host.docker.internal:host-gateway"]
